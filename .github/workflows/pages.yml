name: Deploy browser edition

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'catalog/**'
      - 'package*.json'
      - 'tools/check_web_build.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: python tools/check_catalog.py
      - run: npm run build:web
      - run: python tools/check_web_build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/web-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
